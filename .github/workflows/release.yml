# Based partially on Alyxia's work, thanks so much!

name: Release
on:
  push:
    tags:
      - v*

env:
  FORCE_COLOR: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt install -y pkg-config libsdl2-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libglx-dev libgl1-mesa-dev libxxf86vm-dev libglfw3-dev libwayland-dev libwayland-egl1 libegl-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Install Go dependencies
        run: go get -v

      - name: Recreate vendor and apply Wayland patches
        run: |
          go mod vendor
          git apply patches/wayland.patch

      - name: Build GUI (X11)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags static -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          Equilotl-x11

      - name: Build GUI (Wayland)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static wayland"
          -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o Equilotl-wayland

      - name: Build GUI (Combined)
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "static combined"
          -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git
          rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{
          github.ref_name }}'" -o Equilotl

      - name: Build CLI
        run:
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -v -tags "cli" -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          EquilotlCli-linux

      - name: Update executable
        run: |
          chmod +x Equilotl*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Equilotl-linux
          path: |
            Equilotl-x11
            Equilotl-wayland
            Equilotl
            EquilotlCli-linux

  build-mac:
    runs-on: ${{ matrix.runner }}
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            artifact_name: Equilotl-macos
            gui_name: Equilotl-darwin-x64.zip
            cli_name: EquilotlCli-darwin-x64
          - arch: arm64
            runner: macos-latest
            artifact_name: Equilotl-macos-arm64
            gui_name: Equilotl-darwin-arm64.zip
            cli_name: EquilotlCli-darwin-arm64
    steps:
      - name: Check macOS signing configuration
        id: mac_signing
        env:
          APPLE_SIGNING_CERT: ${{ secrets.APPLE_SIGNING_CERT }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=""
          [ -z "$APPLE_SIGNING_CERT" ] && missing="$missing APPLE_SIGNING_CERT"
          [ -z "$APPLE_SIGNING_CERT_PASSWORD" ] && missing="$missing APPLE_SIGNING_CERT_PASSWORD"
          [ -z "$APPLE_API_KEY" ] && missing="$missing APPLE_API_KEY"
          [ -z "$APPLE_API_KEY_ID" ] && missing="$missing APPLE_API_KEY_ID"
          [ -z "$APPLE_API_ISSUER" ] && missing="$missing APPLE_API_ISSUER"

          if [ -n "$missing" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping macOS ${{ matrix.arch }} build because these Apple signing/notarization secrets are missing:$missing"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: steps.mac_signing.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Install Go
        if: steps.mac_signing.outputs.enabled == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        if: steps.mac_signing.outputs.enabled == 'true'
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-${{ matrix.arch }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-go-

      - name: Install dependencies
        if: steps.mac_signing.outputs.enabled == 'true'
        run: brew install sdl2

      - name: Install Go dependencies
        if: steps.mac_signing.outputs.enabled == 'true'
        run: go get -v

      - name: Build GUI
        if: steps.mac_signing.outputs.enabled == 'true'
        run: CGO_CFLAGS="-mmacosx-version-min=10.15"
          CGO_LDFLAGS="-mmacosx-version-min=10.15" CGO_ENABLED=1 GOOS=darwin
          GOARCH=${{ matrix.arch }} go build -v -tags "static gui" -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          Equilotl

      - name: Build CLI
        if: steps.mac_signing.outputs.enabled == 'true'
        run: CGO_CFLAGS="-mmacosx-version-min=10.15"
          CGO_LDFLAGS="-mmacosx-version-min=10.15" CGO_ENABLED=1 GOOS=darwin
          GOARCH=${{ matrix.arch }} go build -v -tags "cli" -ldflags "-s
          -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short
          HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o
          ${{ matrix.cli_name }}

      - name: Update executable
        if: steps.mac_signing.outputs.enabled == 'true'
        run: |
          chmod +x Equilotl*

      - name: Generate MacOS GUI bundle
        if: steps.mac_signing.outputs.enabled == 'true'
        run: |
          mkdir -p Equilotl.app/Contents/MacOS
          mkdir -p Equilotl.app/Contents/Resources
          cp macos/Info.plist Equilotl.app/Contents/Info.plist
          mv Equilotl Equilotl.app/Contents/MacOS/Equilotl
          cp macos/icon.icns Equilotl.app/Contents/Resources/icon.icns

      - name: Import signing certificate
        if: steps.mac_signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_CERT: ${{ secrets.APPLE_SIGNING_CERT }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERTIFICATE_DATA="${APPLE_SIGNING_CERT#data:*;base64,}"

          decode_certificate() {
            printf "%s" "$CERTIFICATE_DATA" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null && return 0
            printf "%s" "$CERTIFICATE_DATA" | base64 -D > "$CERTIFICATE_PATH"
          }

          if ! decode_certificate || [ ! -s "$CERTIFICATE_PATH" ]; then
            echo "::error::APPLE_SIGNING_CERT did not decode to a valid .p12 file."
            exit 1
          fi

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          if ! security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::Could not import APPLE_SIGNING_CERT. Verify that it is a base64-encoded .p12 and that APPLE_SIGNING_CERT_PASSWORD matches the export password."
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm "$CERTIFICATE_PATH"

      - name: Sign the executables
        if: steps.mac_signing.outputs.enabled == 'true'
        run: |
          codesign --force --options runtime --sign "Developer ID Application" Equilotl.app/Contents/MacOS/Equilotl
          codesign --force --options runtime --sign "Developer ID Application" Equilotl.app
          codesign --force --options runtime --sign "Developer ID Application" ${{ matrix.cli_name }}

      - name: Notarize the executables
        if: steps.mac_signing.outputs.enabled == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" > apple.p8
          ditto -c -k --keepParent Equilotl.app Equilotl-notarize.zip
          ditto -c -k ${{ matrix.cli_name }} EquilotlCli-notarize.zip
          xcrun notarytool submit Equilotl-notarize.zip --key apple.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple Equilotl.app
          xcrun notarytool submit EquilotlCli-notarize.zip --key apple.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          rm apple.p8 Equilotl-notarize.zip EquilotlCli-notarize.zip

      - name: Clean up signing keychain
        if: always() && steps.mac_signing.outputs.enabled == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Create final zip
        if: steps.mac_signing.outputs.enabled == 'true'
        run: zip -r ${{ matrix.gui_name }} Equilotl.app

      - name: Upload artifact
        if: steps.mac_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.gui_name }}
            ${{ matrix.cli_name }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.2"

      - uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\go-build
            ~\go\pkg\mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          path-type: inherit

      - name: Install Windows dependencies
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm git mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2

      - name: Install Go dependencies
        shell: msys2 {0}
        run: |
          go get -v
          go install github.com/tc-hib/go-winres@latest

      - name: Build GUI
        shell: msys2 {0}
        run: |
          go-winres make --product-version "git-tag"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "static gui" -ldflags "-s -w -H=windowsgui -extldflags=-static -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o Equilotl.exe

      - name: Build CLI
        shell: msys2 {0}
        run: |
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 go build -v -tags "cli" -ldflags "-s -w -X 'equilotl/buildinfo.InstallerGitHash=$(git rev-parse --short HEAD)' -X 'equilotl/buildinfo.InstallerTag=${{ github.ref_name }}'" -o EquilotlCli.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Equilotl-windows
          path: |
            Equilotl.exe
            EquilotlCli.exe

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-mac, build-windows]
    if: always() && needs.build-linux.result == 'success' && needs.build-windows.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: "Download Linux Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: Equilotl-linux
          path: linux

      - name: "Download MacOS Artifacts"
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: Equilotl-macos
          path: macos

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: Equilotl-macos-arm64
          path: macos

      - name: "Download Windows Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: Equilotl-windows
          path: windows

      - name: Collect release files
        id: release_files
        run: |
          files=(
            linux/Equilotl-x11
            linux/Equilotl-wayland
            linux/Equilotl
            linux/EquilotlCli-linux
            macos/Equilotl-darwin-x64.zip
            macos/Equilotl-darwin-arm64.zip
            macos/EquilotlCli-darwin-x64
            macos/EquilotlCli-darwin-arm64
            windows/Equilotl.exe
            windows/EquilotlCli.exe
          )

          : > release-files.txt
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "$file" >> release-files.txt
            else
              echo "::notice::Skipping missing release file: $file"
            fi
          done

          if [ ! -s release-files.txt ]; then
            echo "::error::No release files were found."
            exit 1
          fi

          {
            echo "files<<EOF"
            cat release-files.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          make_latest: ${{ !contains(github.ref_name, '-') }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
          body: |
            This is release ${{ github.ref_name }} of Equilotl.
          files: ${{ steps.release_files.outputs.files }}
